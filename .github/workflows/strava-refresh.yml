# Refreshes the Strava receipt on rm17.work every morning.
# Fetches this year's totals into strava.json and commits it only if the numbers
# changed; that push is what makes Render redeploy the site.
# Secrets (already set): STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, STRAVA_REFRESH_TOKEN
name: Refresh Strava stats

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST
  workflow_dispatch: # "Run workflow" button, for a refresh on demand

permissions:
  contents: write # to commit strava.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Strava totals
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 tools/strava_stats.py

      - name: Commit if the numbers changed
        run: |
          # the date inside strava.json changes daily; only commit when km, runs or hours do
          if git diff --quiet -I '"updated"' -- strava.json; then
            echo "No new runs, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh Strava stats"
          git push
